name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One Python version, the one production runs: the Pi's /usr/bin/python3. It is
# set in .python-version, which scripts/check_pinned_deps.py checks too.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check the installed versions match the pins
        run: python scripts/check_pinned_deps.py

      - name: Run tests
        run: python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: black --check house_monitor/ tests/ scripts/

      - name: Lint
        run: ruff check house_monitor/ tests/ scripts/

      - name: Type check
        run: mypy house_monitor/
